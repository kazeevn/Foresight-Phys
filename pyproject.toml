[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresight-phys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"langfuse>=2.60.0",
	"openai>=1.65.0",
	"python-dotenv>=1.0.1",
	"tenacity>=9.0.0",
	"tqdm>=4.66.0",
	"chardet<6",
]

[project.scripts]
foresight-phys = "foresight_phys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foresight_phys"]

[tool.hatch.build.targets.wheel.force-include]
"src/foresight_phys/system_prompt.txt" = "foresight_phys/system_prompt.txt"
