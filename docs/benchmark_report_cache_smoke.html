<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foresight-Phys Human-Readable Report</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --surface: #ffffff;
            --text: #000000;
            --muted: #333333;
            --border: #cccccc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .header { margin-bottom: 14px; }
        .title { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
        .meta { color: var(--muted); font-size: 14px; line-height: 1.5; }
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 16px;
            margin-top: 16px;
            min-height: calc(100vh - 190px);
        }
        .sidebar {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            background: var(--surface);
        }
        .paper-tab {
            width: 100%;
            text-align: left;
            border: 1px solid var(--border);
            background: #f7f7f7;
            color: var(--text);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.35;
        }
        .paper-tab:hover { background: #efefef; }
        .paper-tab.is-active {
            background: #e9f2ff;
            border-color: #8bb8ff;
            font-weight: 600;
        }
        .content {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            padding: 14px;
            overflow: auto;
        }
        .paper-panel { display: none; }
        .paper-panel.is-active { display: block; }
        .paper-panel h2 { margin: 0 0 10px; font-size: 22px; }
        .paper-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .metric-chip {
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 13px;
            background: #fafafa;
        }
        .metric-label { color: var(--muted); margin-right: 8px; }
        .metric-value { font-weight: 700; }
        .experiment-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fcfcfc;
        }
        .experiment-card h3 { margin: 0 0 8px; font-size: 18px; }
        .experiment-description { margin: 0 0 10px; color: #111; }
        .empty-results { color: var(--muted); margin: 0; }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 8px;
            vertical-align: top;
            text-align: left;
        }
        th { background: #f3f3f3; }
        .status-match { color: #0b7d2b; font-weight: 700; }
        .status-mismatch { color: #b3261e; font-weight: 700; }
        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { order: 1; }
            .content { order: 2; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Offline Prediction vs Reference Report</h1>
        <div class="meta">Model: gpt-5-nano</div>
        <div class="meta">Generated: 2026-02-22T11:22:36.899652+00:00</div>
        <div class="meta">Files: 0</div>
        <div class="meta">Aggregate MAPE: n/a</div>
        <div class="meta">Aggregate bool/categorical accuracy: n/a</div>
    </div>
    <div class="layout">
        <aside class="sidebar" aria-label="Papers">
            <div class="empty-sidebar">No files evaluated.</div>
        </aside>
        <main class="content">
            <section class="paper-panel is-active" id="paper-empty"><p>No files evaluated.</p></section>
        </main>
    </div>
    <script>
        const tabs = Array.from(document.querySelectorAll('.paper-tab'));
        const panels = Array.from(document.querySelectorAll('.paper-panel'));
        function activatePanel(panelId) {
            tabs.forEach((tab) => tab.classList.toggle('is-active', tab.dataset.paperId === panelId));
            panels.forEach((panel) => panel.classList.toggle('is-active', panel.id === panelId));
        }
        tabs.forEach((tab) => {
            tab.addEventListener('click', () => activatePanel(tab.dataset.paperId));
        });
    </script>
</body>
</html>
